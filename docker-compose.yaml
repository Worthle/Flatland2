services:
  flatland:
    image: flatland2:humble-fork
    build:
      context: .
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    network_mode: host
    runtime: ${FLATLAND_DOCKER_RUNTIME:-runc}
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      FLATLAND_RENDERER: ${FLATLAND_RENDERER:-cpu}
      NVIDIA_VISIBLE_DEVICES: ${FLATLAND_NVIDIA_DEVICES:-void}
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command:
      - ros2
      - launch
      - flatland
      - simulation.launch.py
      - robot:=${ROBOT:-omni_drive_robot}
      - show_viz:=${SHOW_VIZ:-true}
      - localization:=${LOCALIZATION:-ground_truth}
      - drive_model:=${DRIVE_MODEL:-physics}
    stop_signal: SIGINT
    stop_grace_period: 15s
    stdin_open: true
    tty: true
