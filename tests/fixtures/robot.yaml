bodies:
  - name: base_link
    type: dynamic
    footprints:
      - type: circle
        radius: 0.2
        density: 1.0
plugins:
  - type: DiffDrive
    name: drive
    body: base_link
    pub_rate: 50
  - type: Laser
    name: laser
    body: base_link
    range: 10
    update_rate: 20
    angle: {min: -3.14159, max: 3.14159, increment: 0.0174533}
  - type: MockLidar3D
    name: lidar3d
    body: base_link
    num_rays: 36
    max_range: 10.0
    heights: [1.0]
    range_noise_std_dev: 0.0
    ceiling_height: 2.0
    ceiling_max_range: 0.3
    ceiling_ring_step: 0.1
    ceiling_azimuths: 4
