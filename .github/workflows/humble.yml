name: ROS 2 Humble core

on:
  push:
    branches: [flatland2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the five core packages
        run: docker build --build-arg BUILD_JOBS=2 -t flatland2:humble-core .
      - name: Check core runtime without examples
        run: |
          docker run --rm --network none -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp flatland2:humble-core python3 /opt/flatland-tests/server_smoke.py
          docker run --rm --network none flatland2:humble-core python3 /opt/flatland-tests/dynamics.py
